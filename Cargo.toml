[package]
name = "xcli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Read-only X/Twitter CLI with explicit browser-profile accounts"
repository = "https://github.com/codesoda/x-cli"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
sha2 = "0.10"
tempfile = "3"
zeroize = "1"

[dev-dependencies]

[profile.release]
lto = "thin"
strip = true
