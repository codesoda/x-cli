[package]
name = "xcli"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "Read-only X/Twitter CLI with explicit browser-profile accounts"
repository = "https://github.com/codesoda/x-cli"
publish = false

[features]
default = []
live-tests = []

[[test]]
name = "live"
path = "tests/live.rs"
required-features = ["live-tests"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "2"
sha2 = "0.10"
zeroize = "1"
libc = "0.2"
httpdate = "1"
flate2 = "1"
tar = "0.4"

aes = { version = "0.8.4", features = ["zeroize"] }
cbc = { version = "0.1.2", features = ["zeroize"] }
pbkdf2 = "0.12.2"
sha1 = "0.10.6"
rusqlite = { version = "0.32.1", features = ["bundled"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
